global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    data_center: id
    replica: promereplica

scrape_configs:
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - gpmidservera:9100
          - gpmidserverb:9100
          - gpmidprome1:9100
          - gpmidprome2:9100
          - gpmidgrafana:9100
          - gpmidthanos:9100