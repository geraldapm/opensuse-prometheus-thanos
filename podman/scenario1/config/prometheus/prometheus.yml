global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    data_center: id
    replica: prome1

scrape_configs:
  - job_name: "node_exporter"
    relabel_configs:
      - source_labels: [instance]
        regex: '([^:]+):9100'
        target_label: instance
        replacement: '$1'
        action: replace
    static_configs:
      - targets:
          - gpmidservera:9100
          - gpmidserverb:9100
          - gpmidprome1:9100
          - gpmidgrafana:9100
    