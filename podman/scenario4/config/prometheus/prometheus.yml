global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    data_center: id
    replica: promereplica

scrape_configs:
  - job_name: "node_exporter"
    relabel_configs:
      - source_labels: [instance]
        regex: '([^:]+):9100'
        target_label: instance
        replacement: '$1'
        action: replace
    static_configs:
      - targets:
          - gpmsrvservera:9100
          - gpmsrvserverb:9100
          - gpmsrvprome1:9100
          - gpmsrvprome2:9100
          - gpmsrvgrafana:9100
          - gpmsrvthanos:9100