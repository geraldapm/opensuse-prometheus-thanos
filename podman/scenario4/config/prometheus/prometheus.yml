global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    data_center: id
    replica: promereplica

scrape_configs:
  - job_name: "node_exporter"
    relabel_configs:
      - source_labels: [__address__]
        separator: ':'
        regex: '(.*):9100'
        replacement: '${1}'
        target_label: instance
    static_configs:
      - targets:
          - gpmsrvservera:9100
          - gpmsrvserverb:9100
          - gpmsrvprome1:9100
          - gpmsrvprome2:9100
          - gpmsrvgrafana:9100
          - gpmsrvthanos:9100