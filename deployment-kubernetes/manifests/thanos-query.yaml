---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: thanos-query
  name: thanos-query-prometheus-eu
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-query
    spec:
      serviceAccountName: prometheus
      containers:
      - args:
        - query
        - --log.level=debug
        - --query.replica-label=prometheus_replica
        - --query.replica-label=prometheus
        - --endpoint=dnssrv+_grpc._tcp.prometheus-operated.monitoring.svc.cluster.local
        - --endpoint=dnssrv+_grpc._tcp.thanos-store-0.monitoring.svc.cluster.local
        - --endpoint=dnssrv+_grpc._tcp.thanos-store-1.monitoring.svc.cluster.local
        image: docker.io/thanosio/thanos:v0.42.4
        name: thanos-query
        ports:
        - containerPort: 10902
          name: http
        - containerPort: 10901
          name: grpc
        resources:
          requests:
            cpu: 200m
            memory: 50Mi
          limits:
            cpu: 200m
            memory: 50Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: thanos-query
  name: thanos-query-prometheus-eu
  namespace: monitoring
spec:
  type: NodePort
  ports:
  - name: http
    port: 10902
    targetPort: http
    nodePort: 32111
  selector:
    app.kubernetes.io/name: thanos-query